services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8888:8080"
    volumes:
      - .:/home/coder/project
      - go-modules:/home/coder/go/pkg/mod
    environment:
      - PASSWORD=changeme  # Change this!
    restart: unless-stopped

volumes:
  go-modules:
